services:
  mysql:
    image: mysql:8.4
    container_name: ai_tools_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: ai_tools_platform
      MYSQL_USER: ai_user
      MYSQL_PASSWORD: ai_pass_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --lower-case-table-names=1 --disable-log-bin

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: ai_tools_redis
    restart: unless-stopped
    command: redis-server --requirepass redis123456
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  extension-compiler:
    build: ./backend/extension-compiler
    container_name: ai_tools_ext_compiler
    restart: unless-stopped
    ports:
      - "3456:3456"
    volumes:
      - ./backend/extensions:/extensions:ro

volumes:
  mysql_data:
  redis_data:
