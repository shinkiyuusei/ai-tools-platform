version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: ai_tools_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: ai_tools_platform
      MYSQL_USER: ai_user
      MYSQL_PASSWORD: ai_pass_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: ai_tools_redis
    restart: unless-stopped
    command: redis-server --requirepass redis123456
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
