    <title>知弄 · AI 交互式创作平台</title>

    <style>
      /* === 首屏骨架 === */
      body {
        background: #0d0d14;
        margin: 0;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0d0d14 0%, #141420 50%, #0d0d14 100%);
        z-index: 99999;
        transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
      }
      #app-loading.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loading-brand {
        font-size: 48px;
        font-weight: 700;
        letter-spacing: 0.08em;
        background: linear-gradient(135deg, #7b9cbf, #a3bedb);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 16px;
        font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .loading-icon {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(123, 156, 191, 0.15);
        border-top-color: #7b9cbf;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* === NProgress 风格进度条 === */
      #nprogress {
        pointer-events: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        z-index: 100000;
      }
      #nprogress .bar {
        height: 100%;
        background: linear-gradient(90deg, #7b9cbf, #a3bedb, #7b9cbf);
        box-shadow: 0 0 10px rgba(123, 156, 191, 0.5);
        width: 0;
        transition: width 0.2s ease;
      }
      #nprogress .bar.running {
        animation: progress-indeterminate 1.5s ease-in-out infinite;
      }
      @keyframes progress-indeterminate {
        0% { width: 0; margin-left: 0; }
        50% { width: 70%; margin-left: 15%; }
        100% { width: 0; margin-left: 100%; }
      }

      /* === Telegram Web App 预留 === */
    </style>
  </head>
  <body data-api-prefix="/api/v1">
    <!-- 首屏 Loading（Vue 挂载后自动隐藏） -->
    <div id="app-loading">
      <div class="loading-brand">知弄</div>
      <div class="loading-icon"></div>
    </div>

    <!-- 全局进度条 -->
    <div id="nprogress"><div class="bar"></div></div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
